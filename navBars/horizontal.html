<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="stylesheet" href="horizontal.css">
  <title>Horizontal Navbar</title>
</head>

<body>

  <h2>Horizontal Navbar avec Float</h2>
  <ul class="float">
    <li><a href="#accueil">Accueil</a></li>
    <li><a href="#contact">Contact</a></li>
    <li><a href="#apropos">A Propos</a></li>
  </ul>

  <h2>Horizontal Navbar avec Flex</h2>
  <ul class="flex">
    <li><a href="#accueil">Accueil</a></li>
    <li><a href="#contact">Contact</a></li>
    <li><a href="#apropos">A Propos</a></li>
  </ul>

  <h2>Horizontal Centered Navbar avec Flex</h2>
  <ul class="flex-center">
    <li><a href="#accueil">Accueil</a></li>
    <li><a href="#contact">Contact</a></li>
    <li><a href="#apropos">A Propos</a></li>
  </ul>

</body>

</html>
